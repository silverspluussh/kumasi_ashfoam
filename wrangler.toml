# Cloudflare Workers via @opennextjs/cloudflare (P5).
# Deploy: npm run build:cf && wrangler deploy   (or: npm run deploy)
name = "ashfoam-nextjs"
main = ".open-next/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

